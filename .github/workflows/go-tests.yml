name: Test and Build Web App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    - name: Run tests
      run: go test ./...
    - name: Build browser bundle
      run: make build
