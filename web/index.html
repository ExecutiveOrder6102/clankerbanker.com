<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix and Xapo to Koinly Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="wasm_exec.js"></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Phoenix and Xapo to Koinly Converter</h1>
            <p>Convert Phoenix Wallet or Xapo CSV exports to Koinly-compatible format entirely in your browser.</p>
        </header>

        <main>
            <div class="upload-area" id="drop-zone">
                <input type="file" id="file-input" accept=".csv" hidden>
                <div class="icon">📂</div>
                <p id="upload-prompt">Drag & Drop your <strong>Phoenix CSV</strong> here</p>
                <p class="small">or click to browse</p>
            </div>

            <div class="options">
                <div class="source-group" role="radiogroup" aria-label="Statement type">
                    <input type="radio" id="phoenix-source" name="source" value="phoenix" checked>
                    <label for="phoenix-source">Phoenix (one export)</label>
                    <input type="radio" id="xapo-source" name="source" value="xapo">
                    <label for="xapo-source">Xapo USD/BTC (select all account and interest exports)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="rounding-checkbox">
                    <label for="rounding-checkbox">Adjust for rounding differences (adds a cost transaction)</label>
                </div>
            </div>

            <div id="status" class="status hidden"></div>

            <div id="result-area" class="hidden">
                <button id="download-btn" class="primary-btn">Download koinly.csv</button>
            </div>
        </main>

        <footer>
            <p>Runs locally. No data leaves your device.</p>
            <p>Don't trust me? Good! Check the <a href="https://github.com/ExecutiveOrder6102/phoenix-koinly-converter"
                    target="_blank" rel="noopener noreferrer">repo</a> and run it yourself!</p>
        </footer>
    </div>
</body>

</html>
